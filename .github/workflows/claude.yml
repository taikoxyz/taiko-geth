name: Claude Code
# https://docs.anthropic.com/en/docs/claude-code/github-actions

on:
  issue_comment:
    types: [created]

jobs:
  gate:
    # SECURITY: only owners/members/collaborators can trigger this: issue_comment runs with repo
    # secrets and bypasses the fork-PR approval gate. The PR is resolved and forks are refused in
    # this job, which has no secrets and read-only access, so nothing runs next to the write token
    # or ANTHROPIC_API_KEY before the check passes.
    if: >-
      github.event_name == 'issue_comment'
      && contains(github.event.comment.body, '@claude')
      && github.event.issue.pull_request != null
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Resolve PR head and refuse forks
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          BASE_REPO: ${{ github.repository }}
        run: |
          pr=$(gh api "$PR_URL")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr")
          head_sha=$(jq -r '.head.sha' <<<"$pr")
          # Owner/repo names are case-insensitive; a deleted head repo (null) is refused too.
          if [ "${head_repo,,}" != "${BASE_REPO,,}" ]; then
            echo "Refusing to run: PR head is '${head_repo}', not ${BASE_REPO} (fork PRs are not supported)." >&2
            exit 1
          fi
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

  claude:
    needs: gate
    # GitHub-hosted: fresh VM per job; never run PR code on shared self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # required by claude-code-action to obtain its GitHub App token
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # SECURITY: Pin to exact commit at comment time to prevent TOCTOU attacks
          ref: ${{ needs.gate.outputs.head_sha }}
          # Fetch more history for better git operations
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"

      - name: Verify Node.js installation
        run: |
          echo "Node.js location:"
          which node || echo "Node not found in PATH"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@28f83620103c48a57093dcc2837eec89e036bb9f # beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4)
          # model: "claude-opus-4-20250514"

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Allow Claude to run specific commands
          allowed_tools: |
            mcp__github__create_pull_request
            Bash(cat *)
            Bash(find *)
            Bash(grep *)
            Bash(ls *)
            WebFetch(domain:docs.anthropic.com)

          # Add custom instructions for Claude to customize its behavior for your project
          # custom_instructions: |
           
