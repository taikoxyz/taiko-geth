name: "ZK Gas Vectors"

on:
  pull_request:
    branches: [taiko]
    paths:
      - "core/vm/**"
      - "core/state_processor.go"
      - "core/block_validator.go"
      - "core/evm.go"
      - "consensus/taiko/**"
      - "params/**"
      - "miner/taiko_worker.go"
      - "miner/worker.go"
      - "miner/taiko_zk_gas_vectors_test.go"
      - "go.mod"
      - "go.sum"
      - "zk-gas-vectors.ref"
      - ".github/workflows/zk-gas-vectors.yml"
  push:
    branches: [taiko]
    paths:
      - "core/vm/**"
      - "core/state_processor.go"
      - "core/block_validator.go"
      - "core/evm.go"
      - "consensus/taiko/**"
      - "params/**"
      - "miner/taiko_worker.go"
      - "miner/worker.go"
      - "miner/taiko_zk_gas_vectors_test.go"
      - "go.mod"
      - "go.sum"
      - "zk-gas-vectors.ref"
      - ".github/workflows/zk-gas-vectors.yml"

permissions:
  contents: read

concurrency:
  group: zk-gas-vectors-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/taiko' }}

jobs:
  vectors:
    name: zk-gas-vectors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare environment
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # zk-gas-vectors.ref pins the taiko-mono commit whose corpus this repository is checked against.
      - name: Read the pinned taiko-mono commit
        id: corpus
        run: |
          ref="$(tr -d '[:space:]' < zk-gas-vectors.ref)"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=zk-gas-vectors.ref::expected one 40-hex taiko-mono commit, got '$ref'"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the taiko-mono zk gas vectors
        uses: actions/checkout@v4
        with:
          repository: taikoxyz/taiko-mono
          ref: ${{ steps.corpus.outputs.ref }}
          path: taiko-mono
          sparse-checkout: testdata/zk_gas_vectors
          persist-credentials: false

      - name: Point the runners at the corpus
        run: |
          dir="$GITHUB_WORKSPACE/taiko-mono/testdata/zk_gas_vectors"
          test -d "$dir/cases"
          echo "ZK_GAS_VECTORS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # ZK_GAS_VECTORS_KNOWN_DIVERGENT is for local investigation only and is never set here.
      - name: Run the harness vectors
        run: go test ./core/vm -run '^TestZkGas' -count=1

      - name: Run the block vectors
        run: go test ./miner -run '^TestZkGas' -count=1
