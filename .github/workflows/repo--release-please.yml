name: Release Please

on:
  push:
    branches:
      - [taiko,feature/introduce_new_network_2]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: arc-runner-set
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
